<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>이메일 확인 · 낚시당한 녀석들</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#082c36;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:10vh auto;padding:32px 24px}.brand{font-size:15px;font-weight:700;border-bottom:1px solid #c7d7d8;padding-bottom:24px}.label{margin-top:44px;color:#167f76;font-size:12px;letter-spacing:.15em}h1{font-size:32px;line-height:1.4;letter-spacing:-.04em;margin:14px 0}p{font-size:16px;line-height:1.8}.button{display:block;margin:28px 0 20px;padding:17px;text-align:center;background:#167f76;color:white;text-decoration:none;border-radius:6px;font-weight:700}.help{color:#526d74;font-size:14px}footer{margin-top:40px;font-size:13px}footer a{color:#526d74}a:focus-visible{outline:3px solid #ed8d46;outline-offset:4px}
</style>
</head>
<body>
<main>
<div class="brand">낚시당한 녀석들</div>
<div class="label">ACCOUNT · EMAIL</div>
<h1 id="title">앱으로 돌아가 로그인해 주세요</h1>
<p id="message">이메일 확인 링크를 누르셨다면 앱에서 가입한 이메일과 비밀번호로 로그인해 주세요.</p>
<a class="button" href="baited-brothers://login">앱에서 로그인하기</a>
<p class="help">버튼을 눌러도 앱이 열리지 않나요?<br>이 창을 닫고 휴대폰에서 낚시당한 녀석들 앱을 직접 열어주세요. 앱이 설치된 휴대폰에서 진행해 주세요.</p>
<footer><a href="../">고객 지원</a> · <a href="../../privacy/">개인정보 처리방침</a></footer>
</main>
<script>
(function(){
  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  // Do not retain or forward authentication tokens from the email redirect.
  history.replaceState(null, '', location.pathname);
  if (hash.has('error') || hash.has('error_code') || query.has('error') || query.has('error_code')) {
    document.getElementById('title').textContent = '확인 링크를 사용할 수 없어요';
    document.getElementById('message').textContent = '링크가 만료됐거나 이미 사용됐을 수 있습니다. 먼저 앱에서 로그인해 보세요. 이메일 미확인 안내가 나오면 가입 화면에서 같은 이메일로 다시 가입을 요청해 새 확인 메일을 받아주세요.';
  } else if (hash.has('access_token') && hash.get('type') === 'signup') {
    document.getElementById('title').textContent = '이메일 확인이 완료됐어요';
    document.getElementById('message').textContent = '이제 앱에서 가입한 이메일과 비밀번호로 로그인하고 첫 낚시 기록을 시작해 보세요.';
  }
})();
</script>
</body>
</html>
